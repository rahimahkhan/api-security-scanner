{% extends base_template %}
{% block title %}Page not found — Xploiter{% endblock %}
{% block content %}
<div class="page-head">
    <h2>Page not found</h2>
    <p class="text-muted">The page you're looking for doesn't exist or was moved.</p>
</div>
<div class="card" style="text-align:center; padding:2.5rem 1.5rem;">
    <div style="font-size:3rem; font-weight:800; color:var(--accent);">404</div>
    <p class="text-muted">Nothing to scan here — let's get you back on track.</p>
    <div class="btn-row" style="justify-content:center;">
        <a class="btn btn-primary" href="{{ url_for('dashboard.dashboard') }}">Go to Dashboard</a>
        <a class="btn btn-outline" href="{{ url_for('dashboard.new_scan') }}">New Scan</a>
    </div>
</div>
{% endblock %}
