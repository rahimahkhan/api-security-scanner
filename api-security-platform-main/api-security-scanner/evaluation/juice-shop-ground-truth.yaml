# Juice Shop ground truth — written BEFORE any scan (2026-11-27).
#
# Source: the app's own challenge list (GET /api/Challenges, 118 challenges,
# fetched 2026-11-27) plus the route handlers in server.ts / routes/*.ts that
# prove each vulnerability's endpoint. A challenge is IN SCOPE iff it is
# exercisable through the REST API without browser interaction AND is a
# security bug a generic API scanner could in principle test. 38 of 118
# challenges are in scope below; the rest are excluded by rule, not by
# difficulty:
#   - UI/DOM-only XSS (localXss, videoXss, usernameXss, xssBonus, svgInjection)
#   - Business logic / easter eggs (coupons, NFTs, web3, deluxe, clock, codes)
#   - LLM / chatbot prompt injection (4 challenges; need the optional LLM)
#   - Crypto puzzles, component advisories, typosquatting (report, not probe)
#   - CSRF, CAPTCHA bypass, timing attacks (need a browser / statistics)
#   - Credential guessing (loginAmy/Rapper/Support, weakPassword, dlpPasswordSpraying)
#   - Password-reset flows (need the victim's security answers)
#   - Passkeys / WebAuthn, policy files, steganography
# Items sharing one (template, parameter, category) are ONE bug — several
# challenges can document the same sink (e.g. the /ftp exposure enables six
# challenges). Categories with no scanner check (NoSQL_Injection, JWT_Weak_Key,
# SSTI, Insecure_Deserialization, File_Upload, Security_Misconfiguration,
# Improper_Input_Validation, Arbitrary_File_Write, Broken_Authentication) are
# honest coverage gaps and count as missed until a check exists.
