# Ground truth for the DynaST-Bench fastapi app (vuln variant).
# Written 2026-11-27 from the app's own VULNERABILITIES.yaml, via
# ~/workspace/dynast-codespace/mapping-fastapi-php-2026-11-27.md — BEFORE
# fastapi was started or scanned (graphql is still the running app).
# Only the 9 in-scope items are listed. The other 27 bugs are out of
# scope — 7 need new probing, 20 have no scanner check — so they are
# coverage gaps, never negatives. See the mapping file.
# The two signup items are pre-auth but discovery=flow (multi-step
# signup wizard): whether the scanner's discovery finds those endpoints
# is unproven until the scan runs; they stay in scope with that caveat.
# All items are modes: [vulnerable] — the patched safe twin has none of
# these bugs, so a safe-twin run must not label them (run it with
# DATASET_MODE=safe). fastapi vuln + safe twin are ONE group for
# splitting. DynaST-Bench is new, from one author, not peer-reviewed.
# CORRECTION 2026-11-27: FA-04 (CORS, /api/posts/search) REMOVED after the
# GraphQL scan proved the CORS check cannot detect reflection. The check
# (detection/signature.py, passive CORS policy check) fires solely on a
# literal `Access-Control-Allow-Origin: *` with credentials in a response,
# and the scanner never sends an Origin header or an OPTIONS request. The
# fastapi bug reflects the request's Origin (middleware reflected_cors) —
# a reflected origin is not `*`, so the check cannot fire even in
# principle. CORS is a coverage gap ("needs new probing": active Origin
# header + OPTIONS preflight + reflection check), not a scorable item.
# 9 items remain (FA-04 removed, other IDs kept for traceability).
# Fields follow vamp-ground-truth.yaml: template, parameter (null =
# any parameter on the template — used where the mapping names no exact
# field, rather than guessing one), category, modes, how_verified, date.
# NEAR-MISSES (2026-11-28, from `dynast-bench vulns fastapi --near` +
# VULNERABILITIES.yaml `near_misses:` + the vuln/safe app source): the
# bench lists 9 near-misses for fastapi, but only 2 are ENDPOINT-level
# explicit negatives — a separately reachable route with a matching
# scanner category. The other 7 do not qualify: NM-CLASSPOLL-001,
# NM-AGG-001, NM-SIGNUP-RESEND-001, NM-SIGNUP-TOKEN-001, NM-SSTI-001,
# NM-DESER-001 are for bug classes with no scanner check (class
# pollution, code injection, enumeration, weak token, SSTI,
# deserialization), so no probe category exists to join them on.
# NM-CACHE-001 is explicitly EXCLUDED even though its endpoint is
# probed: it is the safe cache-key behaviour on /api/cache/widget-scoped,
# but that same endpoint carries a VERIFIED REAL reflected XSS
# (FA-INC-03) — a near-miss for cache poisoning is not a negative for
# XSS, and adding it with category XSS would contradict the incidental
# item. The two qualifying near-misses are listed under `near_misses:`
# below. Labeler: pairs on them label 0 with matched_item set and
# near_miss: true (deliberate hard negatives, not default negatives).
# Scorer: a finding on one IS a false positive (the code is safe by the
# bench's design) — counted in the headline FP, and listed separately
# in near_miss_matches so the report can say how many FPs were on hard
# negatives. Both endpoints exist in BOTH twins (verified in
# safe/app/main.py: /api/posts/list line 218, /api/attachments/
# avatar-download line 407), so modes are [vulnerable, safe].
# INCIDENTAL ITEMS (2026-11-28, verified with request + response from
# the session-4 safe-twin scan, then against the safe twin's source):
# the scanner's 3 Confirmed XSS on the safe twin are REAL unlisted
# reflected XSS, present in BOTH twins. Session-4 evidence, all with
# payload <script>alert('xss')</script>, payload_reflected=1,
# unsafe_reflection=1: (1) GET /api/reports/dashboard?name=... →
# probe "<p>Dashboard for <script>alert('xss')</script></p>" vs
# baseline "<p>Dashboard for guest</p>"; (2) GET
# /api/cache/widget?key=... → probe body carries the script tag in the
# canonical href AND the <p> vs baseline "home"; (3) GET
# /api/cache/widget-scoped?key=... → same. Source: safe/app/main.py —
# dashboard uses a bare jinja2.Template (no autoescape, line 273-275);
# both widgets interpolate `key` raw into an f-string HTML body
# (460-472, 474-484). The safe twin FIXED the cache-poisoning (host
# folded into the cache key) but left the `key` reflection — the bench's
# "safe" label covers the cache bug, not the reflection. These items
# carry incidental: true and modes [vulnerable, safe]: the scorer
# excludes findings on them from BOTH TP and FP (own bucket), the
# labeler labels pairs on them 1 in either mode. Scored items stay 9.
items:
  - id: FA-01
    template: /api/posts/search
    parameter: q
    category: SQL_Injection
    modes: [vulnerable]
    how_verified: "VULNERABILITIES.yaml SQLI-001: query-param SQLi on GET /api/posts/search?q; error-based + time-based checks apply. Pre-auth."
    date: "2026-11-27"
    added_after_scan: false
  - id: FA-02
    template: /api/reports/export
    parameter: null
    category: Command_Injection
    modes: [vulnerable]
    how_verified: "VULNERABILITIES.yaml CMD-001: field-bound command injection on POST /api/reports/export. Pre-auth."
    date: "2026-11-27"
    added_after_scan: false
  - id: FA-03
    template: /api/import/xml
    parameter: null
    category: XXE
    modes: [vulnerable]
    how_verified: "VULNERABILITIES.yaml XXE-001: POST /api/import/xml; scanner check requires XML content type + canary proof. Pre-auth."
    date: "2026-11-27"
    added_after_scan: false
  - id: FA-05
    template: /goto
    parameter: null
    category: Open_Redirect
    modes: [vulnerable]
    how_verified: "VULNERABILITIES.yaml REDIRECT-001: GET /goto redirects to an unvalidated URL; proof requires the Location host to match the injected host. Pre-auth."
    date: "2026-11-27"
    added_after_scan: false
  - id: FA-06
    template: /api/attachments/download
    parameter: name
    category: Local_File_Inclusion
    modes: [vulnerable]
    how_verified: "VULNERABILITIES.yaml TRAVERSAL-001: route GET /api/attachments/download?name=, match params [name]. Pre-auth. CORRECTED 2026-11-27: parameter was 'filename' (misread from the notes' prose 'user filename'); the answer key, the app's OpenAPI spec, and the scan all say the parameter is 'name' — the LFI probe bound to 'name' produced the Confirmed finding, and the labeler correctly rejected the 'filename' join."
    date: "2026-11-27"
    added_after_scan: false
  - id: FA-07
    template: /api/error
    parameter: null
    category: Verbose_Error_Exposure
    modes: [vulnerable]
    how_verified: "VULNERABILITIES.yaml DEBUG-001: GET /api/error returns a stack trace + hardcoded secret; passive check. Pre-auth."
    date: "2026-11-27"
    added_after_scan: false
    also_detected_by: [Sensitive_Data_Exposure]
  - id: FA-08
    template: /search
    parameter: q
    category: XSS
    modes: [vulnerable]
    how_verified: "VULNERABILITIES.yaml XSS-REFLECT-001: reflected XSS on GET /search?q. Pre-auth."
    date: "2026-11-27"
    added_after_scan: false
  - id: FA-09
    template: /api/signup/profile
    parameter: null
    category: Mass_Assignment
    modes: [vulnerable]
    how_verified: "VULNERABILITIES.yaml SIGNUP-MASSASSIGN-001: POST /api/signup/profile; scanner check exists, generically Suspected only. Pre-auth, discovery=flow (signup wizard) — whether discovery finds it is unproven until the scan."
    date: "2026-11-27"
    added_after_scan: false
  - id: FA-10
    template: /api/signup/draft/{id}
    parameter: id (path)
    category: BOLA_IDOR
    modes: [vulnerable]
    how_verified: "VULNERABILITIES.yaml SIGNUP-IDOR-001: unauthenticated disclosure of a signup draft by id; Suspected per AUDIT-5, never Confirmed on disclosure alone. Pre-auth, discovery=flow — same caveat as FA-09."
    date: "2026-11-27"
    added_after_scan: false
  - id: FA-INC-01
    template: /api/reports/dashboard
    parameter: name
    category: XSS
    modes: [vulnerable, safe]
    incidental: true
    how_verified: "INCIDENTAL 2026-11-28 (session-4 safe-twin scan): GET /api/reports/dashboard?name=<script>alert('xss')</script> → probe body '<p>Dashboard for <script>alert('xss')</script></p>' vs baseline '<p>Dashboard for guest</p>'; payload_reflected=1, unsafe_reflection=1. Source: safe/app/main.py:273-275, bare jinja2.Template (no autoescape). Same Confirmed on the vuln run (session 3). Real unlisted reflected XSS, present in both twins; not in the bench's answer key."
    date: "2026-11-28"
    added_after_scan: true
  - id: FA-INC-02
    template: /api/cache/widget
    parameter: key
    category: XSS
    modes: [vulnerable, safe]
    incidental: true
    how_verified: "INCIDENTAL 2026-11-28 (session-4 safe-twin scan): GET /api/cache/widget?key=<script>alert('xss')</script> → probe body carries the script tag in the canonical href AND the <p> vs baseline 'home'; payload_reflected=1, unsafe_reflection=1. Source: safe/app/main.py:460-472, f-string interpolates `key` raw into HTML. Safe twin fixed the cache-poisoning (host in cache key) but left the reflection. Same Confirmed on the vuln run (session 3)."
    date: "2026-11-28"
    added_after_scan: true
  - id: FA-INC-03
    template: /api/cache/widget-scoped
    parameter: key
    category: XSS
    modes: [vulnerable, safe]
    incidental: true
    how_verified: "INCIDENTAL 2026-11-28 (session-4 safe-twin scan): GET /api/cache/widget-scoped?key=<script>alert('xss')</script> → probe body carries the script tag in the canonical href AND the <p> vs baseline 'home'; payload_reflected=1, unsafe_reflection=1. Source: safe/app/main.py:474-484, same f-string pattern as FA-INC-02. Same Confirmed on the vuln run (session 3)."
    date: "2026-11-28"
    added_after_scan: true

# needs_auth (2026-11-27, Claude's check, confirmed against the answer
# keys' reachability field): these bugs EXIST, but their routes need a
# logged-in user (reach=user) and the scanner does not authenticate, so
# they are unreachable as the scanner runs today. They are NOT scored
# (never TP, never missed) and pairs on them are EXCLUDED from labeling
# (never positive, never negative — labeling one 0 would teach a model
# that a real bug looks benign). The rule: in scope = matching check
# AND pre-auth reachability. Originally 13 in scope; 3 need auth, 1 is
# CORS (removed) — 9 scored items remain.
needs_auth:
  - id: IDOR-001
    template: /api/posts/{id}
    parameter: id (path)
    category: BOLA_IDOR
    how_verified: "VULNERABILITIES.yaml IDOR-001: GET /api/posts/{id}, any authenticated user can read any post across tenants. reach=user."
    date: "2026-11-27"
  - id: MASSASSIGN-001
    template: /api/users/me
    parameter: null
    category: Mass_Assignment
    how_verified: "VULNERABILITIES.yaml MASSASSIGN-001: PATCH /api/users/me, reach=user."
    date: "2026-11-27"
  - id: PRESIGN-IDOR-001
    template: /api/attachments/{id}/url
    parameter: id (path)
    category: BOLA_IDOR
    how_verified: "VULNERABILITIES.yaml PRESIGN-IDOR-001: GET /api/attachments/{id}/url, presigned URL for any attachment. reach=user."
    date: "2026-11-27"

# near_misses (2026-11-28): safe code of the same shape as a scored bug.
# See the header comment for the qualification rule (separately reachable
# endpoint + matching scanner category) and why only these 2 of 9 qualify.
near_misses:
  - id: FA-NM-01
    template: /api/posts/list
    parameter: q
    category: SQL_Injection
    modes: [vulnerable, safe]
    how_verified: "VULNERABILITIES.yaml near_miss NM-SQL-001 (of SQLI-001): GET /api/posts/list?q=, symbol list_posts (vuln/app/main.py:215-220) — same search shape as FA-01 but using bound SQLAlchemy parameters. Verified in both twins' source (safe/app/main.py:218-219). Pre-auth."
    date: "2026-11-28"
  - id: FA-NM-02
    template: /api/attachments/avatar-download
    parameter: name
    category: Local_File_Inclusion
    modes: [vulnerable, safe]
    how_verified: "VULNERABILITIES.yaml near_miss NM-TRAVERSAL-001 (of TRAVERSAL-001): GET /api/attachments/avatar-download?name=, symbol download_avatar_safe (vuln/app/main.py:394-401) — resolves the path and checks containment under the avatar directory (403 'outside avatar dir'). Verified in both twins' source (safe/app/main.py:407-408). Pre-auth."
    date: "2026-11-28"
