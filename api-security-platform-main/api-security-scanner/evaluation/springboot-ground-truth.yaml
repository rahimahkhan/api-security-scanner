# needs_auth (2026-11-28): these bugs EXIST, but their routes need a
# logged-in user (reach=user) and the scanner does not authenticate, so
# they are unreachable as the scanner runs today. They are NOT scored
# (never TP, never missed) and pairs on them are EXCLUDED from labeling
# (never positive, never negative). Rule: in scope = matching check
# AND pre-auth reachability.
needs_auth:
