    template: /api/posts/{id}
    parameter: id (path)
    category: BOLA_IDOR
    how_verified: "VULNERABILITIES.yaml IDOR-001: GET /api/posts/{id}, authenticated users can read cross-tenant posts by id. reach=user."
    date: "2026-11-28"
  - id: MASSASSIGN-001
    template: /api/users/me
    parameter: null
    category: Mass_Assignment
    how_verified: "VULNERABILITIES.yaml MASSASSIGN-001: PATCH /api/users/me, profile update binds role/isAdmin/enabled from request JSON. reach=user."
    date: "2026-11-28"
  - id: BFLA-001
