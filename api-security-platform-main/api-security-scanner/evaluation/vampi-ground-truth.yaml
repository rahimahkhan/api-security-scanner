# VAmPI ground truth — machine-readable, with provenance.
# Written BEFORE scanning where possible; any item added after a scan is
# flagged (added_after_scan) with the date and how it was verified, so
# evaluation bias is visible, not hidden. The scanner is scored against
# this file, never against a list edited to match its output.
# Fields: template (path template; "*" = app-wide property), parameter
# (path/body field the bug is in, or null), category (scanner attack_type
# it must match; a category with no scanner check is an honest coverage
# gap, not a scoring error), how_verified, date (when the item was
# established), added_after_scan.
items:
  - id: GT-01
    template: /users/v1/{username}
    parameter: username (path)
    category: SQL_Injection
    modes: [vulnerable]
    how_verified: "Manual GET /users/v1/name1' -> 500 + Werkzeug traceback (sqlalchemy OperationalError) in vuln mode, 404 in secure; source: user_model.py get_user() builds raw SELECT with the username interpolated."
    date: 2026-11-27
    added_after_scan: false
  - id: GT-02
    template: /users/v1/{username}/password
    parameter: username (path)
    category: BOLA_IDOR
    modes: [vulnerable]
    how_verified: "README + api_views/users.py update_password(): vuln=1 changes ANY user's password by path username; vuln=0 scopes to token sub. Scanner canary-verified the password change."
    date: 2026-11-27
    added_after_scan: false
  - id: GT-03
    template: /books/v1/{book_title}
    parameter: book_title (path)
    category: BOLA_IDOR
    modes: [vulnerable]
    how_verified: "README + api_views/books.py get_by_title(): vuln=1 returns any user's book + secret by title; vuln=0 scopes to owner."
    date: 2026-11-27
    added_after_scan: false
  - id: GT-04
    template: /users/v1/register
    parameter: admin (body)
    category: Mass_Assignment
    modes: [vulnerable]
    how_verified: "api_views/users.py register_user() honors 'admin' in the register body in vuln mode. Verified both ways via _debug (admin:true stored in vuln, admin:false in secure)."
    date: 2026-11-27
    added_after_scan: false
  - id: GT-05
    template: /users/v1/_debug
    parameter: null
    category: Sensitive_Data_Exposure
    modes: [vulnerable, secure]
    how_verified: "GET /users/v1/_debug returns all users WITH plaintext passwords + admin flags. NOT gated on vuln — exposes in BOTH modes."
    date: 2026-11-27
    added_after_scan: false
  - id: GT-06
    template: /users/v1/login
    parameter: username/password (body)
    category: User_Enumeration
    modes: [vulnerable, secure]
    how_verified: "README + login_user(): vuln=1 returns distinct 'Password is not correct' vs 'Username does not exist'; vuln=0 unifies. No scanner check exists for this category."
    date: 2026-11-27
    added_after_scan: false
  - id: GT-07
    template: /users/v1/{username}/email
    parameter: email (body)
    category: Regex_DoS
    modes: [vulnerable, secure]
    how_verified: "README + update_email(): vuln=1 uses a catastrophic email regex; vuln=0 uses a safe regex. Endpoint path inferred from api_views/users.py. No scanner check exists for this category."
    date: 2026-11-27
    added_after_scan: false
  - id: GT-08
    template: "*"
    parameter: null
    category: Rate_Limiting
    modes: [vulnerable, secure]
    how_verified: "README 'Lack of Resources & Rate Limiting': no rate limiting anywhere, both modes. No scanner check exists for this category."
    date: 2026-11-27
    added_after_scan: false
  - id: GT-09
    template: /users/v1/login
    parameter: null
    category: JWT_Weak_Key
    modes: [vulnerable, secure]
    how_verified: "config.py SECRET_KEY='random', HS256; NOT gated on vuln. Anyone can forge a token with key 'random'. No scanner check exists for this category."
    date: 2026-11-27
    added_after_scan: false
  - id: GT-10
    template: "*"
    parameter: null
    category: Verbose_Error_Exposure
    modes: [vulnerable, secure]
    how_verified: "App runs with the Werkzeug debugger, so any 500 returns a full traceback. Seen on /createdb (duplicate-seed IntegrityError) and on /users/v1/login (SQL error path). Verified independently by re-hitting /createdb twice and reading the traceback."
    date: 2026-11-27
    added_after_scan: true
    added_after_scan_note: "Added 2026-11-27 after the scan surfaced the /createdb traceback. The leak was verified independently (re-hit + traceback read), but the item post-dates the scan and must be counted as such."
    # The traceback that proves this leak is the same text an error-based
    # SQLi finding rests on. A Confirmed SQL_Injection on any endpoint
    # means the traceback was seen — the leak was detected, just filed
    # under SQLi. Reported in the "detected, wrong category" bucket; the
    # item still counts as FN for recall.
    also_detected_by: [SQL_Injection]
