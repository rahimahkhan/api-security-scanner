# Dataset sessions — the human-maintained record for dataset_card.py.
# One entry per scan session. A session marked `excluded` or `superseded`
# is listed with its reason and left out of the card's counts; its records
# must be REMOVED from the dataset directory, not just ignored (the same
# endpoint must not appear twice with different timing — that leaks
# between folds). File paths are codespace paths: the card is generated
# in the codespace, where the logs live.
#
# scanner_commit: the scanner code the scan ran on. `unknown` means it was
# not recorded at scan time — verify from the codespace git reflog against
# the file mtime before the card is used in the report. Sessions 3/4/5
# were resolved that way 2026-11-28: the codespace reflog shows the clone
# at 707e164 with no pull before the scans, and the log mtimes
# (2026-11-27 19:55/21:24/21:37 PKT) fall between the clone and the next
# pull — so all three ran on remote 707e164f.
# harness_commit: the evaluation code the LABELING ran on (label_dataset.py
# + ground-truth files at that commit). The 2026-11-28 re-label of sessions
# 3, 4, 6, 7 ran on the pulled 8157cae harness.

